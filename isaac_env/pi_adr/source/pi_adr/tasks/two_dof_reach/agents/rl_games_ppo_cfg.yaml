params:
  seed: 42

  env:
    clip_observations: 100.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      # 8 -> 256 -> 128 -> 64, ELU (stage-1 report, Table B1)
      units: [256, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: two_dof_reach
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    num_actors: -1        # overwritten at runtime with --num_envs
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95             # GAE lambda
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    schedule_type: legacy
    score_to_win: 100000
    max_epochs: 500
    save_best_after: 50
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.005
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24    # 4096 x 24 = 98,304 transitions per rollout
    # minibatch_size_per_env * 4 == horizon_length keeps exactly 4 minibatches
    # for ANY --num_envs, satisfying rl_games' batch % minibatch == 0 assert.
    minibatch_size_per_env: 6
    mini_epochs: 8
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0001
